name: 🍎 macOS Builds

on:
  workflow_call:
  workflow_dispatch:

env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes

jobs:
  build-macos:
    runs-on: macos-15-intel
    name: ${{ matrix.name }}
    timeout-minutes: 120

    strategy:
      fail-fast: false

      matrix:
        include:
          - name: Editor (target=editor)
            cache-name: macos-editor
            target: editor
            bin: ./bin/godot.macos.editor.universal

          - name: Template (target=template_release)
            cache-name: macos-template
            target: template_release
            scons-flags: debug_symbols=no
            bin: ./bin/godot.macos.template_release.universal

    steps:

      # --------------------------------------------------
      # SOURCE
      # --------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      # --------------------------------------------------
      # GODOT CACHE
      # --------------------------------------------------

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      # --------------------------------------------------
      # PYTHON + SCONS
      # --------------------------------------------------

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      # --------------------------------------------------
      # ANGLE
      # --------------------------------------------------

      - name: Download pre-built ANGLE
        shell: sh
        id: angle-sdk
        run: |
          if python ./misc/scripts/install_angle.py; then
            echo "ANGLE_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::ANGLE SDK installation failed."
            echo "ANGLE_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------
      # ACCESSKIT
      # --------------------------------------------------

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python3 ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------
      # VULKAN
      # --------------------------------------------------

      - name: Setup Vulkan SDK
        id: vulkan-sdk
        run: |
          if sh misc/scripts/install_vulkan_sdk_macos.sh; then
            echo "VULKAN_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vulkan SDK installation failed."
            echo "VULKAN_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi
        continue-on-error: true

      # --------------------------------------------------
      # DEVKITPRO / DEVKITARM
      # --------------------------------------------------

      - name: Setup devkitPro
        shell: bash
        run: |
          brew update
          brew install devkitpro/devkitpro/devkitARM \
            devkitpro/devkitpro/3ds-dev

          echo "DEVKITPRO=/opt/devkitpro" >> "$GITHUB_ENV"
          echo "DEVKITARM=/opt/devkitpro/devkitARM" >> "$GITHUB_ENV"

          echo "/opt/devkitpro/devkitARM/bin" >> "$GITHUB_PATH"

      # --------------------------------------------------
      # CHECK 3DS TOOLCHAIN
      # --------------------------------------------------

      - name: Check Nintendo 3DS toolchain
        shell: bash
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"

          which arm-none-eabi-g++
          arm-none-eabi-g++ --version

          test -f "$DEVKITPRO/libctru/include/3ds.h"
          test -f "$DEVKITPRO/libctru/lib/libctru.a"

          echo "Nintendo 3DS SDK OK"

      # --------------------------------------------------
      # BUILD MACOS x86_64
      # --------------------------------------------------

      - name: Compilation (x86_64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            ${{ matrix.scons-flags }}
            arch=x86_64
            vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
            angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
            metal=no
          platform: macos
          target: ${{ matrix.target }}

      # --------------------------------------------------
      # BUILD MACOS ARM64
      # --------------------------------------------------

      - name: Compilation (arm64)
        uses: ./.github/actions/godot-build
        with:
          scons-flags: >-
            ${{ env.SCONS_FLAGS }}
            ${{ matrix.scons-flags }}
            arch=arm64
            vulkan=${{ steps.vulkan-sdk.outputs.VULKAN_ENABLED }}
            accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
            angle=${{ steps.angle-sdk.outputs.ANGLE_ENABLED }}
          platform: macos
          target: ${{ matrix.target }}

      # --------------------------------------------------
      # BUILD 3DS EXPORT BACKEND
      # --------------------------------------------------

      - name: Build Nintendo 3DS export backend
        shell: bash
        run: |
          echo "Building Godot Nintendo 3DS export backend..."

          scons \
            platform=3ds \
            target=${{ matrix.target }} \
            ${{ env.SCONS_FLAGS }}

      # --------------------------------------------------
      # CACHE
      # --------------------------------------------------

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      # --------------------------------------------------
      # UNIVERSAL BINARY
      # --------------------------------------------------

      - name: Prepare artifact
        shell: bash
        run: |
          lipo -create \
            ./bin/godot.macos.${{ matrix.target }}.x86_64 \
            ./bin/godot.macos.${{ matrix.target }}.arm64 \
            -output \
            ./bin/godot.macos.${{ matrix.target }}.universal

          rm \
            ./bin/godot.macos.${{ matrix.target }}.x86_64 \
            ./bin/godot.macos.${{ matrix.target }}.arm64

          rm -rf ./bin/build_deps

          strip bin/godot.*

          chmod +x bin/godot.*

      # --------------------------------------------------
      # UPLOAD
      # --------------------------------------------------

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      # --------------------------------------------------
      # TESTS
      # --------------------------------------------------

      - name: Unit tests
        run: |
          ${{ matrix.bin }} --version
          ${{ matrix.bin }} --help
          ${{ matrix.bin }} --test --force-colors
