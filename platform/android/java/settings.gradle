// Configure the root project.
pluginManagement {
    apply from: 'app/config.gradle'

    plugins {
        id 'com.android.application' version versions.androidGradlePlugin
        id 'com.android.library' version versions.androidGradlePlugin
        id 'com.android.asset-pack' version versions.androidGradlePlugin
        id 'org.jetbrains.kotlin.android' version versions.kotlinVersion
        id 'io.github.gradle-nexus.publish-plugin' version versions.nexusPublishVersion
        id 'com.android.test' version versions.androidGradlePlugin
        id 'com.android.fused-library' version versions.androidGradlePlugin
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url = "https://plugins.gradle.org/m2/" }
        maven { url = "https://central.sonatype.com/repository/maven-snapshots/"}
    }
}

rootProject.name = "Godot"

// App modules
include ':app'
include ':assetPackInstallTime'
project(':assetPackInstallTime').projectDir = file("app/assetPackInstallTime")
include ':dataLib'
project(':dataLib').projectDir = file("app/dataLib")
include ':fusedDepsLib'
project(':fusedDepsLib').projectDir = file("app/fusedDepsLib")

// Editor modules
include ':editor'
include ':editor:macrobenchmark'

// Godot Android library modules
include ':lib'
include ':nativeSrcsConfigs'
